<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="./styles.css">
    <script src="./app.js" defer></script>
</head>
<body>
    <div class="main">
        <div class="calculator">
            <div class="screen">
                <div class="previous-screen"></div>
                <div class="current-screen">0</div>
            </div>
            <div class="btn-container">
                <button class="btn clear">AC</button> 
                <button class="btn delete">DEL</button> 
                <button class="btn root unary-operator">&Sqrt;n</button> 
                <button class="btn binary-operator">/</button>
                <button class="btn digit">1</button>  
                <button class="btn digit">2</button>  
                <button class="btn digit">3</button>
                <button class="btn binary-operator">*</button>
                <button class="btn digit">4</button>  
                <button class="btn digit">5</button>   
                <button class="btn digit">6</button>       
                <button class="btn binary-operator">+</button>
                <button class="btn digit">7</button>  
                <button class="btn digit">8</button>   
                <button class="btn digit">9</button>       
                <button class="btn binary-operator">-</button>
                <button class="btn digit">0</button>  
                <button class="btn decimal">.</button>   
                <button class="btn sign-change unary-operator">+/-</button>     
                <button class="btn result">=</button>
            </div>
        </div>
    </div>
</body>
</html>
